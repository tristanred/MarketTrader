# Grafana dashboard provider for the local `pnpm observability:up` stack.
#
# Mounted by docker-compose.observability.yml to
#   /otel-lgtm/grafana/conf/provisioning/dashboards/markettrader.yaml
# while the dashboard JSON is mounted separately to the `path` below.
#
# The JSON deliberately lives OUTSIDE the provisioning tree: Grafana's
# provisioning loader reads every file in that directory, and a .json sitting
# next to this .yaml is logged as a malformed provider config on every boot.
apiVersion: 1

providers:
  - name: MarketTrader
    type: file
    folder: MarketTrader
    # Picks up edits without restarting the container.
    updateIntervalSeconds: 10
    # Lets you tweak a panel in the UI to try something out. Changes are still
    # overwritten from disk on the next reload, so the files stay canonical.
    allowUiUpdates: true
    options:
      path: /otel-lgtm/grafana/dashboards/markettrader
      foldersFromFilesStructure: false
