# Containerised nginx for the SPA + API proxy (see Dockerfile.frontend). This is
# the config baked into the image; a non-Docker deployment supplies its own and
# has to be kept in step with the routes below by hand.
#
# Every proxy block sets `X-Forwarded-For $remote_addr`, deliberately *not*
# `$proxy_add_x_forwarded_for`. The latter prepends whatever the client sent, so
# a forged hop would arrive at the app as the leftmost entry — which is what the
# app derives `request.ip` from, and therefore what every rate limit is keyed on.

# Rate-limit zones for the browser telemetry ingress (`location /otel/`) and
# the PostHog relay (`location /relay/`). Must live at http{} scope, which is
# why they sit above the server block.
limit_req_zone $binary_remote_addr zone=otel_ingest:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=relay_ingest:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # PostHog is reached through the same-origin `/relay` proxy below, so it
    # needs no third-party origin here. `worker-src blob:` is for session
    # replay, which compresses recordings in a blob-URL worker.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; worker-src 'self' blob:" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The web app manifest. Only nginx builds shipping a recent mime.types map
    # `.webmanifest`; without this it falls back to application/octet-stream and
    # the browser ignores the manifest, dropping the installed app back to a
    # plain bookmark. `types` replaces the inherited map inside this location,
    # which is fine — one file, one type.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Long-cache hashed asset bundles. Vite emits files under /assets with
    # content hashes in the filename, so they're safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket: must match before the generic /api proxy block.
    location ~ ^/api/games/[^/]+/live$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Indices ticker WebSocket (useIndicesSocket) — same upgrade handling.
    location = /api/ws/live {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Browser telemetry (OpenTelemetry) → the collector's OTLP/HTTP port.
    #
    # UNAUTHENTICATED by necessity: the SPA posts here before anyone signs in.
    # Capped on body size and rate so the one public write path into the
    # telemetry store cannot be used to flood it.
    #
    # Two things are NOT wired on the Docker path and must be added to use this:
    #   1. an `otel-collector` service in docker-compose.yml, and
    #   2. VITE_OTEL_EXPORTER_URL=/otel as a build arg for Dockerfile.frontend
    #      (it is a build-time constant in the SPA bundle, not a runtime env var).
    # The upstream is resolved per-request via a variable rather than at startup,
    # so nginx still boots when no collector is running.
    location ~ ^/otel/(.*)$ {
        limit_req zone=otel_ingest burst=20 nodelay;
        client_max_body_size 256k;

        resolver 127.0.0.11 valid=10s;
        set $otel_upstream http://otel-collector:4318;
        proxy_pass $otel_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PostHog relay: the SPA's api_host is `/relay`, so analytics, replay, flags,
    # and the SDK's lazily-loaded scripts are first-party — invisible to ad
    # blockers and covered by the 'self' CSP. PostHog serves SDK assets and
    # remote config (`/static/`, `/array/`) from a separate host from ingestion,
    # hence two locations; the specific one must come first.
    #
    # UNAUTHENTICATED like /otel, and a write path into a billed project, so it
    # is rate-limited too — but sized for session replay, whose batches are far
    # larger and more frequent than OTLP payloads. Copying /otel's caps would
    # make replay fail with silent 413s and 429s.
    #
    # Upstreams are variables so they are re-resolved per request (`valid=`):
    # PostHog's IPs rotate, and a hostname fixed at startup would keep sending
    # to an address that may since belong to someone else. Cookies are dropped
    # so nothing first-party is forwarded to a third party, and X-Forwarded-For
    # carries the client address so GeoIP resolves to the player, not this host.
    #
    # Like /otel, NOT wired on the Docker path: Dockerfile.frontend passes no
    # VITE_POSTHOG_KEY / VITE_POSTHOG_HOST build args, so the image ships with
    # PostHog off until they are added (build-time constants, not runtime env).
    location ~ ^/relay/(static|array)/(.*)$ {
        limit_req zone=relay_ingest burst=100 nodelay;

        resolver 127.0.0.11 valid=30s;
        set $posthog_assets us-assets.i.posthog.com;
        proxy_pass https://$posthog_assets/$1/$2$is_args$args;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $posthog_assets;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/relay/(.*)$ {
        limit_req zone=relay_ingest burst=100 nodelay;
        client_max_body_size 10m;

        resolver 127.0.0.11 valid=30s;
        set $posthog_api us.i.posthog.com;
        proxy_pass https://$posthog_api/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $posthog_api;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # REST API: /api/* → server:3000/*
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The refresh cookie is scoped to Path=/auth/refresh on the server.
        # Browsers only send the cookie back when the request path matches,
        # so rewrite to the /api/-prefixed path the SPA actually requests.
        proxy_cookie_path /auth/refresh /api/auth/refresh;
    }

    # Swagger UI, served by the API at /docs (not under /api). Without this
    # block /docs falls through to `location /`, which returns index.html and
    # the SPA's catch-all route redirects to /.
    #
    # No prefix rewrite: @fastify/swagger-ui is mounted at /docs on the server
    # and its assets are absolute under /docs/static/. Deliberately no
    # add_header here — an add_header in a location replaces every inherited
    # one, and the server-level CSP already permits Swagger UI (it loads no
    # inline scripts, and style-src already allows unsafe-inline).
    location /docs {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
